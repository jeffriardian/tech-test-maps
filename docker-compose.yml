version: '3.8'
services:
  backend:
    build: .
    working_dir: /app
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '8000:8000'
  frontend:
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host"
